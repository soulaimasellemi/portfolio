<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-monospace, 'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241d29"/><stop offset="1" stop-color="#16121a"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#33293a"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e2a6c3"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- CV doc -->
  <rect x="80" y="200" width="190" height="250" rx="16" fill="#272030" stroke="#e2a6c3" stroke-width="3"/>
  <circle cx="130" cy="250" r="22" fill="#4a3e50"/>
  <rect x="165" y="240" width="80" height="10" rx="5" fill="#5f5266"/><rect x="165" y="258" width="55" height="8" rx="4" fill="#4a3e50"/>
  <rect x="105" y="300" width="140" height="9" rx="4" fill="#5f5266"/><rect x="105" y="320" width="120" height="9" rx="4" fill="#5f5266"/>
  <rect x="105" y="340" width="130" height="9" rx="4" fill="#e8c9a0"/><rect x="105" y="360" width="100" height="9" rx="4" fill="#5f5266"/>
  <rect x="105" y="380" width="135" height="9" rx="4" fill="#e8c9a0"/><rect x="105" y="400" width="90" height="9" rx="4" fill="#5f5266"/>
  <text x="175" y="495" fill="#b0a4b0" font-size="20" text-anchor="middle">CV evidence</text>

  <!-- skill graph -->
  <line x1="285" y1="325" x2="345" y2="325" stroke="#e2a6c3" stroke-width="3" marker-end="url(#ar)"/>
  <g stroke="#c9b8e8" stroke-width="2.5" opacity="0.8">
    <line x1="470" y1="320" x2="400" y2="230"/><line x1="470" y1="320" x2="560" y2="230"/>
    <line x1="470" y1="320" x2="390" y2="410"/><line x1="470" y1="320" x2="570" y2="400"/>
    <line x1="560" y1="230" x2="600" y2="320"/><line x1="570" y1="400" x2="600" y2="320"/>
  </g>
  <circle cx="470" cy="320" r="34" fill="#e2a6c3"/>
  <text x="470" y="327" fill="#2a1320" font-size="17" font-weight="700" text-anchor="middle">Job</text>
  <circle cx="400" cy="230" r="22" fill="#332a45" stroke="#c9b8e8" stroke-width="2"/>
  <circle cx="560" cy="230" r="22" fill="#332a45" stroke="#c9b8e8" stroke-width="2"/>
  <circle cx="390" cy="410" r="22" fill="#332a45" stroke="#c9b8e8" stroke-width="2"/>
  <circle cx="570" cy="400" r="22" fill="#332a45" stroke="#c9b8e8" stroke-width="2"/>
  <circle cx="600" cy="320" r="18" fill="#332a45" stroke="#c9b8e8" stroke-width="2"/>
  <text x="400" y="196" fill="#f2ecf1" font-size="15" text-anchor="middle">Python</text>
  <text x="560" y="196" fill="#f2ecf1" font-size="15" text-anchor="middle">NLP</text>
  <text x="380" y="458" fill="#f2ecf1" font-size="15" text-anchor="middle">Docker</text>
  <text x="590" y="448" fill="#f2ecf1" font-size="15" text-anchor="middle">SQL</text>
  <text x="490" y="495" fill="#b0a4b0" font-size="20" text-anchor="middle">Job skill graph</text>

  <!-- score gauge -->
  <line x1="640" y1="325" x2="700" y2="325" stroke="#e2a6c3" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M725 370 A95 95 0 0 1 915 370" fill="none" stroke="#4a3e50" stroke-width="22" stroke-linecap="round"/>
  <path d="M725 370 A95 95 0 0 1 885 303" fill="none" stroke="#e2a6c3" stroke-width="22" stroke-linecap="round"/>
  <text x="820" y="372" fill="#f2ecf1" font-size="44" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif">78</text>
  <text x="820" y="405" fill="#b0a4b0" font-size="16" text-anchor="middle">match score</text>
  <text x="820" y="495" fill="#b0a4b0" font-size="20" text-anchor="middle">Rule-based scoring</text>

  <!-- bias shield -->
  <line x1="940" y1="325" x2="985" y2="325" stroke="#e2a6c3" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M1065 230 L1135 255 V320 C1135 370 1105 400 1065 420 C1025 400 995 370 995 320 V255 Z" fill="#2b2231" stroke="#e2a6c3" stroke-width="3"/>
  <path d="M1035 322 L1058 345 L1098 298" fill="none" stroke="#e8c9a0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1065" y="495" fill="#b0a4b0" font-size="20" text-anchor="middle">Bias audit</text>

  <!-- report bar -->
  <rect x="80" y="545" width="1060" height="70" rx="16" fill="#2b2231" stroke="#4a3e50" stroke-width="2"/>
  <text x="110" y="588" fill="#f2ecf1" font-size="19">Report: <tspan fill="#e2a6c3">matched skills + evidence</tspan> · <tspan fill="#c9b8e8">gaps</tspan> · <tspan fill="#e8c9a0">bias audit notes</tspan></text>

  <text x="70" y="95" fill="#f2ecf1" font-size="40" font-weight="700" font-family="Inter, system-ui, sans-serif">Explainable CV-Job Matching</text>
  <text x="70" y="135" fill="#e2a6c3" font-size="22">5-phase pipeline with an LLM bias auditor</text>
</svg>
