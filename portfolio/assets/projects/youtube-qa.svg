<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-monospace, 'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241d29"/><stop offset="1" stop-color="#16121a"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#33293a"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e2a6c3"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- video player -->
  <rect x="70" y="190" width="250" height="170" rx="22" fill="#2b2231" stroke="#e2a6c3" stroke-width="3"/>
  <path d="M170 238 L232 275 L170 312 Z" fill="#e2a6c3"/>
  <rect x="95" y="335" width="200" height="6" rx="3" fill="#4a3e50"/>
  <rect x="95" y="335" width="88" height="6" rx="3" fill="#e2a6c3"/>
  <text x="195" y="400" fill="#b0a4b0" font-size="20" text-anchor="middle">YouTube video</text>

  <!-- transcript -->
  <line x1="335" y1="275" x2="400" y2="275" stroke="#e2a6c3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="415" y="170" width="200" height="210" rx="16" fill="#272030" stroke="#4a3e50" stroke-width="2"/>
  <text x="435" y="205" fill="#e8c9a0" font-size="15">00:12</text><rect x="495" y="195" width="100" height="10" rx="5" fill="#5f5266"/>
  <text x="435" y="240" fill="#e8c9a0" font-size="15">00:31</text><rect x="495" y="230" width="80" height="10" rx="5" fill="#5f5266"/>
  <text x="435" y="275" fill="#e8c9a0" font-size="15">01:05</text><rect x="495" y="265" width="95" height="10" rx="5" fill="#5f5266"/>
  <text x="435" y="310" fill="#e8c9a0" font-size="15">01:48</text><rect x="495" y="300" width="70" height="10" rx="5" fill="#5f5266"/>
  <text x="435" y="345" fill="#e8c9a0" font-size="15">02:20</text><rect x="495" y="335" width="90" height="10" rx="5" fill="#5f5266"/>
  <text x="515" y="410" fill="#b0a4b0" font-size="20" text-anchor="middle">Transcript</text>

  <!-- chunks -->
  <line x1="630" y1="275" x2="690" y2="275" stroke="#e2a6c3" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="705" y="175" width="120" height="56" rx="10" fill="#332a45" stroke="#c9b8e8" stroke-width="2"/>
  <rect x="725" y="247" width="120" height="56" rx="10" fill="#332a45" stroke="#c9b8e8" stroke-width="2"/>
  <rect x="705" y="319" width="120" height="56" rx="10" fill="#332a45" stroke="#c9b8e8" stroke-width="2"/>
  <text x="775" y="410" fill="#b0a4b0" font-size="20" text-anchor="middle">Chunks + vectors</text>

  <!-- vector store -->
  <line x1="860" y1="275" x2="915" y2="275" stroke="#e2a6c3" stroke-width="3" marker-end="url(#ar)"/>
  <ellipse cx="1010" cy="200" rx="80" ry="24" fill="#2b2231" stroke="#e2a6c3" stroke-width="3"/>
  <path d="M930 200 V330 A80 24 0 0 0 1090 330 V200" fill="#2b2231" stroke="#e2a6c3" stroke-width="3"/>
  <path d="M930 245 A80 24 0 0 0 1090 245 M930 288 A80 24 0 0 0 1090 288" fill="none" stroke="#e2a6c3" stroke-width="2" opacity="0.6"/>
  <text x="1010" y="400" fill="#b0a4b0" font-size="20" text-anchor="middle">Vector store</text>

  <!-- chat answer -->
  <rect x="250" y="470" width="700" height="130" rx="22" fill="#2b2231" stroke="#4a3e50" stroke-width="2"/>
  <circle cx="300" cy="510" r="18" fill="#c9b8e8"/>
  <text x="335" y="517" fill="#f2ecf1" font-size="21">What does the speaker say about attention?</text>
  <circle cx="300" cy="565" r="18" fill="#e2a6c3"/>
  <text x="335" y="572" fill="#f2ecf1" font-size="21">At <tspan fill="#e8c9a0">01:05</tspan> she explains that attention lets…</text>
  <path d="M1010 420 V535 H965" fill="none" stroke="#e2a6c3" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#ar)"/>

  <text x="70" y="95" fill="#f2ecf1" font-size="40" font-weight="700" font-family="Inter, system-ui, sans-serif">YouTube Transcript Q&amp;A</text>
  <text x="70" y="135" fill="#e2a6c3" font-size="22">RAG · LangChain</text>
</svg>
